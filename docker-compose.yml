# Reference deployment for the omo-core server.
#
# Setup:
#   1. Copy `.env.example` → `.env`.
#   2. Set OMO_COMICS_PATH (host comic library, read-only mount) and
#      OMO_DATA_PATH (host writable dir for DB + cache).
#   3. Optionally set OMO_AUTH_TOKEN for non-tailnet deployments.
#   4. `docker compose up -d --build`

services:
  omo-core:
    image: omo-core:latest
    build: .
    container_name: omo-core
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      HOST: "0.0.0.0"
      PORT: "3210"
      # Auth token: leave empty for tailnet-only deployments where mesh
      # membership IS the access control. Set a long random value for any
      # deployment reachable from the public internet.
      OMO_AUTH_TOKEN: "${OMO_AUTH_TOKEN:-}"
      OMO_DB_PATH: "/data/omo-reader.db"
      # Persistent thumbnail/metadata cache, under the data volume so it
      # survives restarts (otherwise covers regenerate every boot).
      OMO_CACHE_PATH: "/data/cache"
      # Base directory for relative Local Share paths. When set, the Sources
      # UI shows it as a non-editable prefix; users enter sub-paths like
      # "Western" rather than the full container path.
      OMO_LIBRARY_ROOT: "/comics"
    volumes:
      # Comic library (read-only). Set OMO_COMICS_PATH in .env.
      - ${OMO_COMICS_PATH:?set OMO_COMICS_PATH in .env}:/comics:ro
      # SQLite DB + writable state. Set OMO_DATA_PATH in .env.
      - ${OMO_DATA_PATH:?set OMO_DATA_PATH in .env}:/data
